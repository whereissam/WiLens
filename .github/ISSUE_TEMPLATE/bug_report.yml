name: Bug report
description: Something in WiLens doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste a real Wi-Fi password or a photo of a real network's QR code.** Use made-up values instead.
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Join (scanning or connecting)
        - Share (making a QR code)
        - Check connection
        - Installing or launching
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Include any message WiLens showed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open WiLens
        2. Click ...
        3. See ...
  - type: textarea
    id: check-report
    attributes:
      label: Connection check report (optional)
      description: For connection problems, run **Check connection**, click **Copy report**, and paste it here. It contains no passwords or network names.
      render: text
  - type: input
    id: version
    attributes:
      label: WiLens version
      placeholder: e.g. 0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 15.6 or Windows 11 24H2
  - type: dropdown
    id: security
    attributes:
      label: Network security type (if relevant)
      options:
        - Not relevant
        - WPA / WPA2 Personal
        - WPA3 Personal
        - WEP
        - Open (no password)
        - Enterprise (802.1X)
        - Not sure
